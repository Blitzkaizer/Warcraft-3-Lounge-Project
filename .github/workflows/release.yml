name: Build & Release Warcraft III Lounge

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run Test Suite
        run: |
          python -m pytest tests/ -v

      - name: Build Windows Executables (PyInstaller)
        run: |
          python -m PyInstaller Warcraft3Lounge.spec --noconfirm
          python -m PyInstaller Warcraft3Lounge_Portable.spec --noconfirm

      - name: Determine Version
        shell: powershell
        run: |
          $ver = (Select-String -Path "src\core\config.py" -Pattern 'APP_VERSION\s*=\s*"([^"]+)"').Matches.Groups[1].Value
          "RELEASE_VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "RELEASE_TAG=v$ver" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Package Release Zip
        shell: powershell
        run: |
          $ZipName = "Warcraft3Lounge_Setup_${{ env.RELEASE_TAG }}.zip"
          Compress-Archive -Path "dist\Warcraft3Lounge\*" -DestinationPath "dist\$ZipName" -Force
          Write-Host "Created release package: dist\$ZipName"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            dist/Warcraft3Lounge_Setup_*.zip
            dist/Warcraft3Lounge_Portable.exe
          generate_release_notes: true
          draft: false
          prerelease: false
